name: Release Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REDOCLY_TELEMETRY: 'off'

jobs:
  binaries:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install Dependencies
        run: npm ci

      # The binary bundles packages/core and packages/respect-core from their
      # compiled lib/ output, so the workspace has to be built first.
      - name: Compile Packages
        run: npm run compile
        env:
          BUILD_ENV: production

      - name: Build Binaries
        run: |
          mkdir -p binaries
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            bun build packages/cli/src/index.ts \
              --compile \
              --target="bun-$target" \
              --define 'process.env.REDOCLY_CLI_BUILD_ENV="production"' \
              --outfile "binaries/redocly-$target"
          done
          ls -la binaries

      - name: Smoke Test
        run: |
          ./binaries/redocly-linux-x64 --version
          ./binaries/redocly-linux-x64 bundle resources/museum.yaml --output=bundled.yaml

      - name: Create Release
        run: |
          version="$(jq -r '.version' packages/cli/package.json)"
          tag="v$version-$GITHUB_RUN_NUMBER"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Redocly CLI $version (build $GITHUB_RUN_NUMBER)" \
            --notes "Standalone \`redocly\` binaries built from \`$GITHUB_SHA\`. No Node.js required — download the file for your platform, \`chmod +x\`, and run it." \
            binaries/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
